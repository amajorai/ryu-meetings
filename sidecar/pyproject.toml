[project]
name = "ryu-diarize-sidecar"
version = "0.1.0"
description = "Ryu's Core-managed model-neutral speaker-diarization runtime"
requires-python = ">=3.10"
# Base server deps only. The heavy model stacks live in optional extras so the
# server boots and serves /health without either inference runtime installed; a
# missing dependency or HF token becomes a clear per-request 503, not a boot crash.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
# Model runtimes are separate extras so users install only the large stack they
# intend to use. Install a CUDA-matched torch/torchaudio pair first when using
# NVIDIA acceleration.
diarize = ["pyannote.audio>=3.1", "torch>=2.13.0", "torchaudio>=2.0"]
nemotron = [
    "accelerate>=1.15.0",
    "torch>=2.13.0",
    "torchaudio>=2.0",
    "transformers @ git+https://github.com/huggingface/transformers",
]

[project.scripts]
ryu-diarize = "ryu_diarize.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ryu_diarize"]
